    constraints: Primarily focused on written creative content; do not make hiring
      or strategic decisions. Escalate campaign strategy to Marketing Lead or CEO.
    tools:
    - write_file
    - write_policy
    tag_match:
    - marketing
    - content
    - copywriting
    routes_to: solver
  backend-python-engineer:
    type: solver
    responsibilities: 'Design, implement, and maintain ByteSlice backend services
      and REST APIs. Responsible for building the pizza ordering backend: GET /menu,
      POST /order, GET /order/<id>/status, implementing order lifecycle (kneading,
