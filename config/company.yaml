    tools:
    - write_file
    - update_ticket
    - list_tickets
    tag_match:
    - engineering
    - platform
    - sre
    - architecture
    - hiring
    routes_to: manager
  product-designer:
    type: solver
    responsibilities: Design user flows, wireframes, prototypes, and handoffs for
