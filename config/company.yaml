    constraints: Escalate major tradeoffs to CEO. Does not own go-to-market messaging.
    tools:
    - write_file
    - read_policy
    tag_match:
    - engineering
    - backend
    - frontend
    routes_to: lead
  frontend-marketing-designer:
    type: solver
    responsibilities: Design and implement high-conversion, mobile-first landing pages
