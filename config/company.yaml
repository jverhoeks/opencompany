      tight deadlines (including investor demos).
    constraints: No backend or infrastructure responsibilities. Must hand off all
      assets and include deployment instructions.
    tools:
    - write_file
    - read_policy
    tag_match:
    - frontend
    - marketing
    routes_to: solver
  marketing-copywriter:
    type: solver
    responsibilities: Create brand-forward marketing copy including menus, product
      descriptions, ad copy, and social content. Craft witty, punny, and on-brand
      messaging for AI-themed products and campaigns. Collaborate with design, product,
