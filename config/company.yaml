# ── NovaCraft Studios ─────────────────────────────────────────────
# Small cloud/software company building "Pixel Siege" — a browser-
# based multiplayer tower-defence game.
# ─────────────────────────────────────────────────────────────────

personas:

  # ── Management ──────────────────────────────────────────────────

  - id: ceo
    name: "Morgan Reeves"
    role: "CEO"
    type: manager
    skills: [strategy, delegation, hiring, business, product]
    tools: [create_ticket, list_tickets, update_ticket, list_team, hire_persona, fire_persona]
