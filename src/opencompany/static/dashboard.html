<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaCraft — Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep:    #06080f;
  --bg-panel:   #0c1018;
  --bg-card:    #111822;
  --bg-hover:   #182030;
  --border:     #1a2235;
  --border-glow:#1e3a5f;
  --text-main:  #d0d8e8;
  --text-dim:   #5a6a80;
  --text-bright:#f0f4fa;
  --cyan:       #00e5ff;
  --green:      #39ff8a;
  --amber:      #ffb020;
  --red:        #ff4060;
  --purple:     #a78bfa;
  --blue:       #60a5fa;
  --font-display: 'Orbitron', monospace;
  --font-body:    'Outfit', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}

html, body { height: 100%; background: var(--bg-deep); color: var(--text-main); font-family: var(--font-body); overflow: hidden; }

/* ── Noise overlay ─────────────────────────────── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  background-repeat: repeat; opacity: 0.4;
}

/* ── Layout ────────────────────────────────────── */
.shell {
  display: grid; height: 100vh;
  grid-template-rows: 48px 1fr;
  grid-template-columns: 280px 1fr 320px;
  grid-template-areas:
    "header header header"
    "sidebar main   feed";
  gap: 1px; background: var(--border);
}

/* ── Header ────────────────────────────────────── */
.header {
  grid-area: header; background: var(--bg-panel);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--border-glow);
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.hex-logo {
  width: 28px; height: 28px; background: var(--cyan);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}
.header-brand h1 {
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase; color: var(--cyan);
}
.header-brand span {
  font-family: var(--font-body); font-size: 11px; color: var(--text-dim);
  margin-left: 8px; letter-spacing: 1px;
}
.header-meta { display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-size: 11px; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.clock { color: var(--text-dim); }

/* ── Sidebar ───────────────────────────────────── */
.sidebar {
  grid-area: sidebar; background: var(--bg-panel);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-title {
  font-family: var(--font-display); font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-dim); padding: 14px 16px 8px;
  border-bottom: 1px solid var(--border);
}
.team-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.team-member {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px; cursor: pointer; transition: background 0.15s;
}
.team-member:hover { background: var(--bg-hover); }
.team-member.selected { background: var(--bg-hover); border-left: 2px solid var(--cyan); }
.avatar {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-family: var(--font-display); font-size: 11px;
  font-weight: 700; color: var(--bg-deep); flex-shrink: 0;
}
.member-info { flex: 1; min-width: 0; }
.member-name { font-size: 13px; font-weight: 500; color: var(--text-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.member-role { font-size: 11px; color: var(--text-dim); }
.member-stats {
  display: flex; gap: 3px; margin-top: 3px;
}
.member-stat {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
  border-radius: 3px; background: var(--bg-card); color: var(--text-dim);
  white-space: nowrap; border: 1px solid transparent;
}
.member-stat.active { background: rgba(255,176,32,0.12); color: var(--amber); border-color: rgba(255,176,32,0.2); }
.member-stat.created { background: rgba(0,229,255,0.08); color: var(--cyan); border-color: rgba(0,229,255,0.15); }
.member-stat.done { background: rgba(57,255,138,0.08); color: var(--green); border-color: rgba(57,255,138,0.15); }
.member-stat.actions { background: rgba(167,139,250,0.08); color: var(--purple); border-color: rgba(167,139,250,0.15); }
.member-stat .stat-val { font-weight: 600; }

/* Budget bar */
.budget-bar-wrap {
  margin-top: 4px; height: 4px; background: var(--bg-deep); border-radius: 2px;
  overflow: hidden; position: relative;
}
.budget-bar-fill {
  height: 100%; border-radius: 2px; transition: width 0.3s;
}
.budget-label {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  margin-top: 2px;
}

/* State dots */
.state-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.state-dot.idle { background: #555; }
.state-dot.working { background: var(--green); animation: pulse 2s ease-in-out infinite; }
.state-dot.blocked { background: var(--red); }

/* Fired persona styling */
.team-member.fired { opacity: 0.4; }
.team-member.fired .member-name { text-decoration: line-through; }
.team-member.fired .avatar { filter: grayscale(1); }

/* KPI strip at bottom of sidebar */
.kpi-strip {
  border-top: 1px solid var(--border); padding: 10px 16px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.kpi {
  background: var(--bg-card); border-radius: 6px; padding: 8px 10px;
  border: 1px solid var(--border);
}
.kpi-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
.kpi-value { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin-top: 2px; }

/* ── Main ──────────────────────────────────────── */
.main {
  grid-area: main; background: var(--bg-deep); overflow-y: auto;
  display: flex; flex-direction: column;
}
.board-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
}
.board-header h2 {
  font-family: var(--font-display); font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--text-dim);
}
.board-tabs { display: flex; gap: 4px; }
.board-tab {
  font-family: var(--font-mono); font-size: 11px; padding: 4px 10px;
  border-radius: 4px; background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; transition: all 0.15s;
}
.board-tab:hover { border-color: var(--text-dim); }
.board-tab.active { background: var(--cyan); color: var(--bg-deep); border-color: var(--cyan); }

.kanban {
  flex: 1; display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 1px; padding: 12px; background: transparent;
  min-height: 0; overflow-y: auto;
}
.kanban-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-header {
  font-family: var(--font-display); font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-dim); padding: 6px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.col-count {
  font-family: var(--font-mono); font-size: 10px; background: var(--bg-card);
  padding: 1px 6px; border-radius: 3px;
}
.ticket-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px; transition: all 0.15s; cursor: pointer;
}
.ticket-card:hover { border-color: var(--border-glow); transform: translateY(-1px); }
.ticket-title { font-size: 12px; font-weight: 500; color: var(--text-bright); margin-bottom: 6px; line-height: 1.4; }
.ticket-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ticket-tag {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
  border-radius: 3px; background: rgba(0,229,255,0.1); color: var(--cyan);
}
.ticket-priority {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
  border-radius: 3px;
}
.ticket-priority.high, .ticket-priority.critical { background: rgba(255,64,96,0.15); color: var(--red); }
.ticket-priority.medium { background: rgba(255,176,32,0.15); color: var(--amber); }
.ticket-priority.low { background: rgba(57,255,138,0.1); color: var(--green); }
.ticket-assignee { font-size: 10px; color: var(--text-dim); margin-left: auto; }
.ticket-tokens {
  font-family: var(--font-mono); font-size: 9px; padding: 1px 5px;
  border-radius: 3px; background: rgba(167,139,250,0.1); color: var(--purple);
}
.empty-col { font-size: 11px; color: var(--text-dim); text-align: center; padding: 20px 8px; opacity: 0.5; }

/* ── Modal ──────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  backdrop-filter: blur(4px); animation: fadeIn 0.15s;
}
.modal {
  background: var(--bg-panel); border: 1px solid var(--border-glow);
  border-radius: 10px; width: min(480px, 90vw); max-height: 80vh;
  overflow-y: auto; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 14px;
}
.modal-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); }
.modal-close {
  font-size: 18px; color: var(--text-dim); cursor: pointer; background: none;
  border: none; line-height: 1;
}
.modal-close:hover { color: var(--text-bright); }
.modal-section { margin-bottom: 12px; }
.modal-label {
  font-family: var(--font-display); font-size: 9px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px;
}
.modal-text { font-size: 12px; color: var(--text-main); line-height: 1.5; }
.modal-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.modal-match {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
  margin-bottom: 4px; font-size: 12px; color: var(--text-main); cursor: pointer;
  transition: all 0.15s;
}
.modal-match:hover { border-color: var(--cyan); background: var(--bg-hover); }
.modal-match.active { border-color: var(--green); background: rgba(57,255,138,0.05); }
.modal-match-score {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
}
.modal-btn {
  font-family: var(--font-display); font-size: 10px; padding: 6px 14px;
  border: none; border-radius: 6px; cursor: pointer; letter-spacing: 1px;
  font-weight: 700; transition: opacity 0.15s;
}
.modal-btn.primary { background: var(--cyan); color: var(--bg-deep); }
.modal-btn.danger { background: var(--red); color: #fff; }
.modal-btn:hover { opacity: 0.85; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ── Feed / Chat ───────────────────────────────── */
.feed {
  grid-area: feed; background: var(--bg-panel);
  display: flex; flex-direction: column; overflow: hidden;
}
.feed-tabs {
  display: flex; border-bottom: 1px solid var(--border);
}
.feed-tab {
  flex: 1; padding: 10px; text-align: center; font-family: var(--font-display);
  font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.feed-tab:hover { color: var(--text-main); }
.feed-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

.feed-content { flex: 1; overflow-y: auto; }
.feed-pane { display: none; flex-direction: column; height: 100%; }
.feed-pane.active { display: flex; }

/* Activity feed */
.activity-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.activity-item {
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.activity-item:hover { background: var(--bg-hover); }
.activity-time { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.activity-text { font-size: 12px; color: var(--text-main); margin-top: 2px; line-height: 1.4; }
.activity-persona { color: var(--cyan); font-weight: 500; }

/* Chat */
.chat-pane { display: none; flex-direction: column; height: 100%; }
.chat-pane.active { display: flex; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px; }
.chat-msg {
  margin-bottom: 10px; padding: 8px 12px; border-radius: 8px;
  max-width: 90%; font-size: 12px; line-height: 1.5;
}
.chat-msg.user {
  background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2);
  margin-left: auto; color: var(--text-bright);
}
.chat-msg.bot {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-main);
}
.chat-msg-sender { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-bottom: 3px; }
.chat-input-area {
  border-top: 1px solid var(--border); padding: 8px 12px;
  display: flex; flex-direction: column; gap: 6px;
}
.chat-select {
  font-family: var(--font-mono); font-size: 11px; padding: 6px 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-main); width: 100%;
}
.chat-input-row {
  display: flex; gap: 6px;
}
.chat-input {
  flex: 1; min-width: 0; font-family: var(--font-body); font-size: 12px; padding: 6px 10px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-main); outline: none; transition: border 0.15s;
}
.chat-input:focus { border-color: var(--cyan); }
.chat-send {
  font-family: var(--font-display); font-size: 10px; padding: 6px 14px;
  background: var(--cyan); color: var(--bg-deep); border: none; border-radius: 6px;
  cursor: pointer; letter-spacing: 1px; font-weight: 700; transition: opacity 0.15s;
  flex-shrink: 0;
}
.chat-send:hover { opacity: 0.85; }
.chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
.typing-indicator {
  font-size: 11px; color: var(--text-dim); padding: 8px 12px;
  display: none; align-items: center; gap: 8px;
}
.typing-indicator.visible { display: flex; }
.typing-dots { display: flex; gap: 4px; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); opacity: 0.3;
  animation: dotPulse 1.4s ease-in-out infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse { 0%, 60%, 100% { opacity: 0.3; transform: scale(1); } 30% { opacity: 1; transform: scale(1.3); } }

/* Overseer tab */
.overseer-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.overseer-msg {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.overseer-msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.overseer-msg-from { font-family: var(--font-mono); font-size: 10px; color: var(--cyan); }
.overseer-msg-time { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.overseer-msg-body { font-size: 12px; color: var(--text-main); line-height: 1.5; margin-bottom: 6px; }
.overseer-msg-reply { font-size: 11px; color: var(--green); margin-top: 4px; }
.overseer-reply-row { display: flex; gap: 6px; margin-top: 6px; }
.overseer-reply-input {
  flex: 1; font-family: var(--font-body); font-size: 11px; padding: 4px 8px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-main); outline: none;
}
.overseer-reply-btn {
  font-family: var(--font-display); font-size: 9px; padding: 4px 10px;
  background: var(--cyan); color: var(--bg-deep); border: none; border-radius: 4px;
  cursor: pointer; font-weight: 700;
}
.overseer-badge {
  display: inline-block; background: var(--red); color: #fff; font-size: 9px;
  padding: 0 5px; border-radius: 8px; margin-left: 4px; font-family: var(--font-mono);
}

/* ── Scrollbar ─────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* ── Animations ────────────────────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease forwards; }

/* ── No-data ───────────────────────────────────── */
.no-data {
  display: flex; align-items: center; justify-content: center;
  height: 100%; color: var(--text-dim); font-size: 12px;
}
</style>
</head>
<body>
<div class="shell">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="hex-logo"></div>
      <h1>NovaCraft</h1>
      <span>Control Tower</span>
    </div>
    <div class="header-meta">
      <div class="status-dot" id="statusDot"></div>
      <span id="connLabel">LIVE</span>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <!-- Sidebar: Team roster + KPIs -->
  <aside class="sidebar">
    <div class="panel-title">Team Roster</div>
    <div class="team-list" id="teamList"></div>
    <div class="kpi-strip" id="kpiStrip"></div>
  </aside>

  <!-- Main: Kanban board -->
  <section class="main">
    <div class="board-header">
      <h2>Task Board</h2>
      <div class="board-tabs" id="boardTabs"></div>
    </div>
    <div class="kanban" id="kanban"></div>
  </section>

  <!-- Feed: Activity + Chat -->
  <aside class="feed">
    <div class="feed-tabs">
      <div class="feed-tab active" data-pane="activity">Activity</div>
      <div class="feed-tab" data-pane="chat">Chat</div>
      <div class="feed-tab" data-pane="overseer">Overseer<span class="overseer-badge" id="overseerBadge" style="display:none"></span></div>
    </div>
    <div class="feed-content">
      <div class="feed-pane active" id="activityPane">
        <div class="activity-list" id="activityList"></div>
      </div>
      <div class="feed-pane" id="chatPane">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="typing-indicator" id="typingIndicator">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span>Thinking...</span>
        </div>
        <div class="chat-input-area">
          <select class="chat-select" id="chatPersona"></select>
          <div class="chat-input-row">
            <input class="chat-input" id="chatInput" placeholder="Send a message..." />
            <button class="chat-send" id="chatSend">SEND</button>
          </div>
        </div>
      </div>
      <div class="feed-pane" id="overseerPane">
        <div class="overseer-list" id="overseerList"></div>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // ── Helpers ────────────────────────────────────
  function el(tag, className, textContent) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (textContent !== undefined) e.textContent = textContent;
    return e;
  }

  function clearChildren(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // Persona colour palette (deterministic from id)
  const PALETTE = ['#00e5ff','#39ff8a','#ffb020','#ff4060','#a78bfa','#60a5fa','#f472b6','#fbbf24','#34d399'];
  function personaColor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = ((h << 5) - h + id.charCodeAt(i)) | 0;
    return PALETTE[Math.abs(h) % PALETTE.length];
  }
  function initials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }
  function formatTokens(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  // ── State ──────────────────────────────────────
  let state = { personas: [], tickets: [], status_counts: {}, work_log: [] };
  let personaMap = {};
  let activeFilter = 'all';
  let connected = true;

  // ── Clock ──────────────────────────────────────
  const clockEl = document.getElementById('clock');
  function tickClock() {
    const now = new Date();
    clockEl.textContent = now.toUTCString().slice(17, 25) + ' UTC';
  }
  setInterval(tickClock, 1000);
  tickClock();

  // ── Feed tabs ──────────────────────────────────
  document.querySelectorAll('.feed-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.feed-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.feed-pane').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.pane + 'Pane').classList.add('active');
    });
  });

  // ── Render: Team list ──────────────────────────
  const teamListEl = document.getElementById('teamList');
  function renderTeam() {
    clearChildren(teamListEl);
    state.personas.forEach(p => {
      const isFired = p.status === 'fired';
      const row = el('div', 'team-member' + (isFired ? ' fired' : ''));

        // Toggle board filter
        activeFilter = (activeFilter === p.id) ? 'all' : p.id;
        document.querySelectorAll('.team-member').forEach(m => m.classList.remove('selected'));
        if (activeFilter !== 'all') {
          row.classList.add('selected');

          if (!isFired && chatPersonaEl.querySelector(`option[value="${p.id}"]`)) {
            chatPersonaEl.value = p.id;
            switchChatPersona();
          }
        }
        renderBoard();
        // Show persona detail popup
        showPersonaModal(p);
      });

      // State dot
      const dot = el('div', 'state-dot ' + (isFired ? 'idle' : (p.activity_state || 'idle')));

      const av = el('div', 'avatar');
      av.style.background = personaColor(p.id);
      av.textContent = initials(p.name);
      row.appendChild(av);

      const info = el('div', 'member-info');
      info.appendChild(el('div', 'member-name', p.name + (isFired ? ' (fired)' : '')));
      info.appendChild(el('div', 'member-role', p.role));

      if (!isFired) {
        const stats = el('div', 'member-stats');
        function addStat(cls, icon, val) {
          if (val > 0) {
            const s = el('span', 'member-stat ' + cls);
            const ic = document.createTextNode(icon + ' ');
            s.appendChild(ic);
            const v = el('span', 'stat-val', String(val));
            s.appendChild(v);
            stats.appendChild(s);
          }
        }
        addStat('active',  '\u25B6', p.workload);  // ▶ active tasks
        addStat('created', '\u270E', p.created);    // ✎ tickets created
        addStat('done',    '\u2713', p.done);       // ✓ completed
        addStat('actions', '\u26A1', p.actions);    // ⚡ actions taken
        if (stats.children.length === 0) {
          const idle = el('span', 'member-stat', p.activity_state || 'idle');
          stats.appendChild(idle);
        }
        info.appendChild(stats);

        // Budget bar
        if (p.daily_token_budget > 0) {
          const pct = Math.min(100, Math.round((p.tokens_used_today || 0) / p.daily_token_budget * 100));
          const barWrap = el('div', 'budget-bar-wrap');
          const barFill = el('div', 'budget-bar-fill');
          barFill.style.width = pct + '%';
          barFill.style.background = pct >= 90 ? 'var(--red)' : pct >= 70 ? 'var(--amber)' : 'var(--green)';
          barWrap.appendChild(barFill);
          info.appendChild(barWrap);
          const label = el('div', 'budget-label',
            formatTokens(p.tokens_used_today || 0) + ' / ' + formatTokens(p.daily_token_budget) + ' tokens (' + pct + '%)');
          info.appendChild(label);
        }
      }
      row.appendChild(info);

      teamListEl.appendChild(row);
    });
  }

  // ── Render: KPIs ───────────────────────────────
  const kpiStripEl = document.getElementById('kpiStrip');
  const KPI_DEFS = [
    { key: 'total',    label: 'Total',   color: 'var(--text-bright)' },
    { key: 'open',     label: 'Open',    color: 'var(--cyan)' },
    { key: 'assigned', label: 'Active',  color: 'var(--amber)' },
    { key: 'done',     label: 'Done',    color: 'var(--green)' },
  ];
  function renderKPIs() {
    clearChildren(kpiStripEl);
    const total = state.tickets.length;
    const counts = state.status_counts;
    const vals = {
      total: total,
      open: (counts['open'] || 0),
      assigned: (counts['assigned'] || 0) + (counts['in_progress'] || 0),
      done: (counts['done'] || 0),
    };
    KPI_DEFS.forEach(d => {
      const card = el('div', 'kpi');
      card.appendChild(el('div', 'kpi-label', d.label));
      const v = el('div', 'kpi-value', String(vals[d.key] || 0));
      v.style.color = d.color;

  // ── Render: Board tabs ─────────────────────────
  const COLUMNS = [
    { key: 'open',        label: 'Open',        statuses: ['open'] },
    { key: 'assigned',    label: 'Assigned',     statuses: ['assigned'] },
    { key: 'in_progress', label: 'In Progress',  statuses: ['in_progress'] },
    { key: 'done',        label: 'Done',         statuses: ['done', 'review'] },
  ];

  // ── Render: Kanban ─────────────────────────────
  const kanbanEl = document.getElementById('kanban');
  function renderBoard() {
    clearChildren(kanbanEl);
    COLUMNS.forEach(col => {
      const colDiv = el('div', 'kanban-col');

      // Column header
      const hdr = el('div', 'col-header');
      const tickets = state.tickets.filter(t =>
        col.statuses.includes(t.status) &&
        (activeFilter === 'all' || t.assigned_to === activeFilter || t.created_by === activeFilter)
      );
      hdr.appendChild(el('span', '', col.label));
      hdr.appendChild(el('span', 'col-count', String(tickets.length)));
      colDiv.appendChild(hdr);

      if (tickets.length === 0) {
        colDiv.appendChild(el('div', 'empty-col', 'No tickets'));
      } else {
        tickets.forEach(t => {
          const card = el('div', 'ticket-card fade-in');

          card.appendChild(el('div', 'ticket-title', t.title));

          const meta = el('div', 'ticket-meta');

          // Priority badge
          const pBadge = el('span', 'ticket-priority ' + (t.priority || 'medium'));
          pBadge.textContent = (t.priority || 'medium').toUpperCase();
          meta.appendChild(pBadge);

          // Tags
          if (t.tags && t.tags.length) {
            t.tags.slice(0, 3).forEach(tag => {
              meta.appendChild(el('span', 'ticket-tag', tag));
            });
          }

          // Assignee
          if (t.assigned_to && personaMap[t.assigned_to]) {
            meta.appendChild(el('span', 'ticket-assignee', personaMap[t.assigned_to]));
          }

          // Token count
          const totalTokens = (t.tokens_in || 0) + (t.tokens_out || 0);
          if (totalTokens > 0) {
            const tk = el('span', 'ticket-tokens', formatTokens(totalTokens));
            meta.appendChild(tk);
          }

          card.appendChild(meta);
          card.addEventListener('click', () => showTicketModal(t));
          colDiv.appendChild(card);
        });
      }

      kanbanEl.appendChild(colDiv);

  // ── Ticket detail modal ─────────────────────────
  function fuzzyScore(solverTags, ticketTags) {
    let score = 0;
    const st = new Set(solverTags.map(s => s.toLowerCase()));
    for (const tt of ticketTags.map(t => t.toLowerCase())) {
      if (st.has(tt)) { score += 1; continue; }
      for (const s of st) { if (s.includes(tt) || tt.includes(s)) { score += 0.5; break; } }
    }
    return score;
  }

  function showTicketModal(ticket) {
    // Find matching personas
    const matches = state.personas
      .filter(p => p.status === 'active' && p.type === 'solver')
      .map(p => ({ ...p, score: fuzzyScore(p.picks_up || p.skills || [], ticket.tags || []) }))
      .sort((a, b) => b.score - a.score);

    const overlay = el('div', 'modal-overlay');
    const modal = el('div', 'modal');

    // Header
    const header = el('div', 'modal-header');
    header.appendChild(el('div', 'modal-title', `#${ticket.id} ${ticket.title}`));
    const closeBtn = el('button', 'modal-close', '\u00D7');
    closeBtn.addEventListener('click', () => overlay.remove());
    header.appendChild(closeBtn);
    modal.appendChild(header);

    // Description
    if (ticket.description) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', 'Description'));
      sec.appendChild(el('div', 'modal-text', ticket.description));
      modal.appendChild(sec);
    }

    // Tags
    if (ticket.tags && ticket.tags.length) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', 'Tags'));
      const tagsDiv = el('div', 'modal-tags');
      ticket.tags.forEach(tag => tagsDiv.appendChild(el('span', 'ticket-tag', tag)));
      sec.appendChild(tagsDiv);
      modal.appendChild(sec);
    }

    // Meta: priority, status, created_by, assigned_to
    const metaSec = el('div', 'modal-section');
    metaSec.appendChild(el('div', 'modal-label', 'Details'));
    const details = [
      `Priority: ${(ticket.priority || 'medium').toUpperCase()}`,
      `Status: ${ticket.status}`,
      ticket.created_by ? `Created by: ${personaMap[ticket.created_by] || ticket.created_by}` : null,
      ticket.assigned_to ? `Assigned to: ${personaMap[ticket.assigned_to] || ticket.assigned_to}` : 'Unassigned',
    ].filter(Boolean).join(' \u2022 ');
    metaSec.appendChild(el('div', 'modal-text', details));
    // Token usage
    const tIn = ticket.tokens_in || 0;
    const tOut = ticket.tokens_out || 0;
    if (tIn + tOut > 0) {
      const tokenText = `Tokens: ${formatTokens(tIn)} in / ${formatTokens(tOut)} out (${formatTokens(tIn + tOut)} total)`;
      const tokenEl = el('div', 'modal-text');
      tokenEl.style.color = 'var(--purple)';
      tokenEl.style.fontFamily = 'var(--font-mono)';
      tokenEl.style.fontSize = '11px';
      tokenEl.textContent = tokenText;
      metaSec.appendChild(tokenEl);
    }
    modal.appendChild(metaSec);

    // Result (if any)
    if (ticket.result) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', 'Result'));
      sec.appendChild(el('div', 'modal-text', ticket.result));
      modal.appendChild(sec);
    }

    // Matching personas
    const matchSec = el('div', 'modal-section');
    matchSec.appendChild(el('div', 'modal-label', 'Matching team members'));
    if (matches.length === 0) {
      matchSec.appendChild(el('div', 'modal-text', 'No matching solvers available'));
    } else {
      matches.forEach(m => {
        const row = el('div', 'modal-match' + (ticket.assigned_to === m.id ? ' active' : ''));
        const nameSpan = el('span', '', `${m.name} (${m.role})`);
        row.appendChild(nameSpan);
        const scoreSpan = el('span', 'modal-match-score',
          m.score > 0 ? `score: ${m.score.toFixed(1)}` : 'no match');
        row.appendChild(scoreSpan);
        row.addEventListener('click', () => assignTicket(ticket.id, m.id, overlay));
        matchSec.appendChild(row);
      });
    }
    modal.appendChild(matchSec);

    // Actions
    const actions = el('div', 'modal-actions');
    if (ticket.assigned_to) {
      const unassign = el('button', 'modal-btn danger', 'UNASSIGN');
      unassign.addEventListener('click', () => assignTicket(ticket.id, '', overlay));
      actions.appendChild(unassign);
    }
    modal.appendChild(actions);

    overlay.appendChild(modal);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  }

  async function assignTicket(ticketId, personaId, overlay) {
    try {
      const body = { assigned_to: personaId };
      if (!personaId) body.status = 'open';
      await fetch(`/api/tickets/${ticketId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (overlay) overlay.remove();
      poll(); // Refresh data
    } catch (err) {
      console.error('Assign failed:', err);
    }
  }

  // ── Persona detail modal ────────────────────────
  function showPersonaModal(p) {
    const overlay = el('div', 'modal-overlay');
    const modal = el('div', 'modal');

    // Header
    const header = el('div', 'modal-header');
    const titleRow = el('div', '');
    titleRow.style.display = 'flex';
    titleRow.style.alignItems = 'center';
    titleRow.style.gap = '10px';
    const dot = el('div', 'state-dot ' + (p.status === 'fired' ? 'idle' : (p.activity_state || 'idle')));
    dot.style.position = 'static';
    titleRow.appendChild(dot);
    titleRow.appendChild(el('span', 'modal-title', p.name));
    header.appendChild(titleRow);
    const closeBtn = el('button', 'modal-close', '\u00D7');
    closeBtn.addEventListener('click', () => overlay.remove());
    header.appendChild(closeBtn);
    modal.appendChild(header);

    // Role & status
    const infoSec = el('div', 'modal-section');
    infoSec.appendChild(el('div', 'modal-label', 'Role'));
    infoSec.appendChild(el('div', 'modal-text', `${p.role} (${p.type}) \u2022 ${p.status}`));
    modal.appendChild(infoSec);

    // Skills / picks_up
    const tags = p.picks_up && p.picks_up.length ? p.picks_up : p.skills;
    if (tags && tags.length) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', 'Picks up'));
      const tagsDiv = el('div', 'modal-tags');
      tags.forEach(tag => tagsDiv.appendChild(el('span', 'ticket-tag', tag)));
      sec.appendChild(tagsDiv);
      modal.appendChild(sec);
    }

    // Stats
    const statsSec = el('div', 'modal-section');
    statsSec.appendChild(el('div', 'modal-label', 'Stats'));
    statsSec.appendChild(el('div', 'modal-text',
      `Active: ${p.workload || 0} \u2022 Created: ${p.created || 0} \u2022 Done: ${p.done || 0} \u2022 Actions: ${p.actions || 0}`
    ));
    modal.appendChild(statsSec);

    // Budget
    if (p.daily_token_budget > 0) {
      const budgetSec = el('div', 'modal-section');
      budgetSec.appendChild(el('div', 'modal-label', 'Token Budget'));
      const pct = Math.min(100, Math.round((p.tokens_used_today || 0) / p.daily_token_budget * 100));
      const barWrap = el('div', 'budget-bar-wrap');
      barWrap.style.height = '8px';
      const barFill = el('div', 'budget-bar-fill');
      barFill.style.width = pct + '%';
      barFill.style.background = pct >= 90 ? 'var(--red)' : pct >= 70 ? 'var(--amber)' : 'var(--green)';
      barWrap.appendChild(barFill);
      budgetSec.appendChild(barWrap);
      const budgetText = el('div', 'modal-text');
      budgetText.style.fontFamily = 'var(--font-mono)';
      budgetText.style.fontSize = '11px';
      budgetText.textContent = `${formatTokens(p.tokens_used_today || 0)} / ${formatTokens(p.daily_token_budget)} tokens (${pct}%)`;
      if (p.model_id) {
        budgetText.textContent += ` \u2022 Model: ${p.model_id}`;
      }
      budgetSec.appendChild(budgetText);
      modal.appendChild(budgetSec);
    } else if (p.model_id) {
      const modelSec = el('div', 'modal-section');
      modelSec.appendChild(el('div', 'modal-label', 'Model'));
      modelSec.appendChild(el('div', 'modal-text', p.model_id));
      modal.appendChild(modelSec);
    }

    // Assigned tickets
    const assigned = state.tickets.filter(t =>
      t.assigned_to === p.id && ['assigned', 'in_progress', 'review'].includes(t.status)
    );
    const created = state.tickets.filter(t =>
      t.created_by === p.id && !assigned.some(a => a.id === t.id)
    );

    if (assigned.length) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', `Assigned tickets (${assigned.length})`));
      assigned.forEach(t => {
        const row = el('div', 'modal-match');
        row.appendChild(el('span', '', `#${t.id} ${t.title}`));
        const badge = el('span', 'ticket-priority ' + (t.status === 'in_progress' ? 'medium' : 'low'));
        badge.textContent = t.status;
        row.appendChild(badge);
        row.addEventListener('click', () => { overlay.remove(); showTicketModal(t); });
        sec.appendChild(row);
      });
      modal.appendChild(sec);
    }

    if (created.length) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-label', `Created tickets (${created.length})`));
      created.slice(0, 10).forEach(t => {
        const row = el('div', 'modal-match');
        row.appendChild(el('span', '', `#${t.id} ${t.title}`));
        const badge = el('span', 'modal-match-score', t.status);
        row.appendChild(badge);
        row.addEventListener('click', () => { overlay.remove(); showTicketModal(t); });
        sec.appendChild(row);
      });
      modal.appendChild(sec);
    }

    if (!assigned.length && !created.length) {
      const sec = el('div', 'modal-section');
      sec.appendChild(el('div', 'modal-text', 'No tickets assigned or created'));
      modal.appendChild(sec);

    // Actions
    const actions = el('div', 'modal-actions');
    if (p.status === 'active' && chatPersonaEl.querySelector(`option[value="${p.id}"]`)) {
      const chatBtn = el('button', 'modal-btn primary', 'OPEN CHAT');
      chatBtn.addEventListener('click', () => {
        overlay.remove();
        chatPersonaEl.value = p.id;
        switchChatPersona();
        // Switch to chat tab
        document.querySelectorAll('.feed-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.feed-pane').forEach(p => p.classList.remove('active'));
        const chatTab = document.querySelector('[data-pane="chat"]');
        if (chatTab) { chatTab.classList.add('active'); }
        const chatPane = document.getElementById('chatPane');
        if (chatPane) { chatPane.classList.add('active'); }
      });
      actions.appendChild(chatBtn);
    }
    modal.appendChild(actions);

    overlay.appendChild(modal);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  }

  // ── Render: Activity feed ──────────────────────
  const activityListEl = document.getElementById('activityList');
  function renderActivity() {
    clearChildren(activityListEl);
    if (state.work_log.length === 0) {
      activityListEl.appendChild(el('div', 'no-data', 'No activity yet'));
      return;
    }
    state.work_log.forEach(log => {
      const item = el('div', 'activity-item');

      const time = el('div', 'activity-time');
      if (log.created_at) {
        const d = new Date(log.created_at);
        time.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      item.appendChild(time);

      const text = el('div', 'activity-text');
      const who = el('span', 'activity-persona', personaMap[log.persona_id] || log.persona_id);
      text.appendChild(who);
      const actionText = ' ' + log.action;
      if (log.ticket_id) {
        text.appendChild(document.createTextNode(actionText + ' #' + log.ticket_id));
      } else {
        text.appendChild(document.createTextNode(actionText));
      }
      if (log.details) {
        const detailSpan = el('span', '', ' — ' + (typeof log.details === 'string' ? log.details : JSON.stringify(log.details)));
        detailSpan.style.color = 'var(--text-dim)';
        text.appendChild(detailSpan);
      }
      item.appendChild(text);

      activityListEl.appendChild(item);
    });
  }

  // ── Render: Chat persona select ────────────────
  const chatPersonaEl = document.getElementById('chatPersona');
  let currentChatPersona = '';
  const chatHistories = {};  // { personaId: [{sender, text, isUser}] }

  function renderChatSelect() {
    const prev = chatPersonaEl.value;
    clearChildren(chatPersonaEl);
    state.personas.filter(p => p.status === 'active').forEach(p => {
      const opt = el('option', '', p.name + ' (' + p.role + ')');
      opt.value = p.id;
      chatPersonaEl.appendChild(opt);
    });
    // Restore previous selection if still valid
    if (prev && [...chatPersonaEl.options].some(o => o.value === prev)) {
      chatPersonaEl.value = prev;
    }
    switchChatPersona();
  }

  function switchChatPersona() {
    const personaId = chatPersonaEl.value;
    if (personaId === currentChatPersona) return;
    currentChatPersona = personaId;
    // Render stored history for this persona
    clearChildren(chatMessagesEl);
    const history = chatHistories[personaId] || [];
    history.forEach(m => renderChatBubble(m.sender, m.text, m.isUser));
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  chatPersonaEl.addEventListener('change', switchChatPersona);

  // ── Chat ───────────────────────────────────────
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatInputEl = document.getElementById('chatInput');
  const chatSendEl = document.getElementById('chatSend');
  const typingEl = document.getElementById('typingIndicator');

  function renderChatBubble(sender, text, isUser) {
    const msg = el('div', 'chat-msg ' + (isUser ? 'user' : 'bot'));
    if (!isUser) msg.appendChild(el('div', 'chat-msg-sender', sender));
    msg.appendChild(document.createTextNode(text));
    chatMessagesEl.appendChild(msg);
  }

  function stripThinking(text) {
    return text.replace(/<thinking>[\s\S]*?<\/thinking>\s*/g, '').trim();
  }

  function addChatMessage(sender, text, isUser) {
    if (!isUser) text = stripThinking(text);
    const personaId = currentChatPersona;
    if (!chatHistories[personaId]) chatHistories[personaId] = [];
    chatHistories[personaId].push({ sender, text, isUser });
    renderChatBubble(sender, text, isUser);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  async function sendChat() {
    const message = chatInputEl.value.trim();
    if (!message) return;
    const personaId = chatPersonaEl.value;
    const personaName = personaMap[personaId] || personaId;

    addChatMessage('You', message, true);
    chatInputEl.value = '';
    chatSendEl.disabled = true;
    typingEl.classList.add('visible');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona_id: personaId, message: message }),
      });
      const data = await res.json();
      addChatMessage(personaName, data.response || data.detail || 'No response', false);
    } catch (err) {
      addChatMessage('System', 'Error: ' + err.message, false);
    } finally {
      chatSendEl.disabled = false;
      typingEl.classList.remove('visible');
    }
  }

  chatSendEl.addEventListener('click', sendChat);
  chatInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  // ── Data update ────────────────────────────────
  const statusDot = document.getElementById('statusDot');
  const connLabel = document.getElementById('connLabel');
  let prevStateJSON = '';

  function applyState(newState) {
    const newJSON = JSON.stringify(newState);
    // Skip re-render when data is unchanged
    if (newJSON === prevStateJSON) {
      if (!connected) {
        connected = true;
        statusDot.style.background = 'var(--green)';
        connLabel.textContent = 'LIVE';
      }
      return;
    }
    prevStateJSON = newJSON;
    state = newState;

    // Build persona lookup
    personaMap = {};
    state.personas.forEach(p => { personaMap[p.id] = p.name; });

    // Re-render
    renderTeam();
    renderKPIs();
    renderBoard();
    renderActivity();

    // Update chat select when persona list changes
    renderChatSelect();

    if (!connected) {
      connected = true;
      statusDot.style.background = 'var(--green)';
      connLabel.textContent = 'LIVE';
    }
  }

  // ── Poll (fallback) ──────────────────────────────
  let pollTimer = null;

  async function poll() {
    try {
      const res = await fetch('/api/dashboard/overview');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      applyState(await res.json());
    } catch (err) {
      connected = false;
      statusDot.style.background = 'var(--red)';
      connLabel.textContent = 'OFFLINE';
    }
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(poll, 5000);
    poll();
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  // ── SSE (primary) ────────────────────────────────
  function connectSSE() {
    const evtSource = new EventSource('/api/dashboard/stream');
    evtSource.onmessage = function (event) {
      stopPolling();
      applyState(JSON.parse(event.data));
    };
    evtSource.onerror = function () {
      evtSource.close();
      connected = false;
      statusDot.style.background = 'var(--red)';
      connLabel.textContent = 'OFFLINE';
      // Fall back to polling, then retry SSE after 10s
      startPolling();
      setTimeout(connectSSE, 10000);
    };
  }

  // ── Overseer tab ──────────────────────────────
  const overseerListEl = document.getElementById('overseerList');
  const overseerBadgeEl = document.getElementById('overseerBadge');
  let overseerMessages = [];

  async function loadOverseerMessages() {
    try {
      const res = await fetch('/api/overseer/messages');
      if (!res.ok) return;
      overseerMessages = await res.json();
      renderOverseer();
    } catch (e) { /* ignore */ }
  }

  function renderOverseer() {
    // Don't re-render if the user is typing a reply — it would destroy their input
    if (overseerListEl.querySelector('.overseer-reply-input:focus')) return;
    clearChildren(overseerListEl);
    const pending = overseerMessages.filter(m => !m.reply);
    if (pending.length > 0) {
      overseerBadgeEl.textContent = String(pending.length);
      overseerBadgeEl.style.display = 'inline-block';
    } else {
      overseerBadgeEl.style.display = 'none';
    }

    if (overseerMessages.length === 0) {
      overseerListEl.appendChild(el('div', 'no-data', 'No messages from personas'));
      return;
    }
    overseerMessages.forEach(m => {
      const item = el('div', 'overseer-msg');

      const hdr = el('div', 'overseer-msg-header');
      hdr.appendChild(el('span', 'overseer-msg-from', personaMap[m.persona_id] || m.persona_id));
      if (m.created_at) {
        const d = new Date(m.created_at);
        hdr.appendChild(el('span', 'overseer-msg-time', d.toLocaleString()));
      }
      item.appendChild(hdr);

      item.appendChild(el('div', 'overseer-msg-body', m.message));

      if (m.reply) {
        item.appendChild(el('div', 'overseer-msg-reply', 'Reply: ' + m.reply));
      } else {
        const replyRow = el('div', 'overseer-reply-row');
        const input = el('input', 'overseer-reply-input');
        input.placeholder = 'Type reply...';
        const btn = el('button', 'overseer-reply-btn', 'REPLY');
        btn.addEventListener('click', async () => {
          const reply = input.value.trim();
          if (!reply) return;
          btn.disabled = true;
          try {
            await fetch('/api/overseer/messages/' + m.id + '/reply', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ reply: reply }),
            });
            loadOverseerMessages();
          } catch (e) { btn.disabled = false; }
        });
        replyRow.appendChild(input);
        replyRow.appendChild(btn);
        item.appendChild(replyRow);
      }

      overseerListEl.appendChild(item);
    });
  }

  // Load overseer messages periodically
  setInterval(loadOverseerMessages, 5000);
  loadOverseerMessages();

  // Initial load via poll, then switch to SSE
  poll();
  connectSSE();
})();
</script>
</body>
</html>
