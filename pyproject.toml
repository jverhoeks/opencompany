[project]
name = "opencompany"
version = "0.1.0"
description = "Virtual AI company — autonomous agent personas coordinating via task board"
author = "Jacob Verhoeks <jacob.verhoeks@gmail.com>"
requires-python = ">=3.14"
dependencies = [
    "strands-agents>=0.3.0",
    "strands-agents-tools>=0.1.0",
    "litellm>=1.93.0",
    "boto3>=1.35.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "redis>=5.0.0",
    "apscheduler>=3.11.0",
    "python-telegram-bot>=22.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.6",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[project.scripts]
opencompany = "opencompany.main:main"

# ---------------------------------------------------------------------------
# Security overrides: force patched versions of transitive deps whose upstream
# parent pins an exact vulnerable release.
#
# - aiohttp: litellm hard-pins ``aiohttp==3.13.3`` up through 1.83.13 despite
#   10 GHSAs fixed in 3.13.4 (client-side cookie leak on cross-origin
#   redirect GHSA-966j-vmvw-g2g9, CRLF injection in multipart, DNS cache DoS,
#   etc.). 3.13.3 → 3.13.4 is a patch release — API-compatible.
# - python-dotenv: litellm hard-pins ``python-dotenv==1.0.1``; 1.2.2 patches
#   GHSA-mf9w-mj56-hr94 (symlink-following in ``set_key``). Not exploitable
#   in our code (we don't call ``set_key``) but we upgrade as defense-in-depth.
#
# Revisit when litellm relaxes the exact pins upstream.
[tool.uv]
override-dependencies = [
    "aiohttp>=3.13.4",
    "python-dotenv>=1.2.2",
]

# ---------------------------------------------------------------------------
# Cooldown exceptions.
#
# The default uv cooldown (``exclude-newer-span = "P7D"``) blocks any package
# uploaded within the last 7 days — a sensible supply-chain safeguard against
# recently-compromised releases. We override it for Strands because we track
# upstream tightly: the SDK is AWS-maintained, releases are small (mostly bug
# fixes and telemetry improvements), and the RSS ``get_feed_file_path``
# path-traversal fix in tools 0.5.0 is worth picking up promptly even though
# we don't use RSS tools today.
#
# Cutoff is set a day past the current strands release (2026-04-22) so any
# surprise release gets the standard cooldown. Bump when upgrading again.
[tool.uv.exclude-newer-package]
"strands-agents" = "2026-04-25"
"strands-agents-tools" = "2026-04-25"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/opencompany/gateway/api.py" = ["B008"]
"src/opencompany/gateway/dashboard.py" = ["B008", "E741"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
