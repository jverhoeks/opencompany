[project]
name = "opencompany"
version = "0.1.0"
description = "Virtual AI company — autonomous agent personas coordinating via task board"
author = "Jacob Verhoeks <jacob.verhoeks@gmail.com>"
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=0.3.0",
    "strands-agents-tools>=0.1.0",
    "litellm>=1.75.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "redis>=5.0.0",
    "apscheduler>=3.11.0",
    "python-telegram-bot>=22.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
]

[project.scripts]
opencompany = "opencompany.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/opencompany/gateway/api.py" = ["B008"]
"src/opencompany/gateway/dashboard.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
